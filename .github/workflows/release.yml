# Publishes the gem to rubygems.org when a version tag (v1.2.3) is pushed.
#
# Uses RubyGems Trusted Publishing (OIDC) — no API key is stored anywhere.
# ONE-TIME SETUP required before the first release:
#   1. On rubygems.org: gem page -> Ownership -> Trusted publishers -> add
#      GitHub repo ncr/rack-proxy, workflow release.yml, environment `release`.
#   2. On GitHub: Settings -> Environments -> create `release`. Add protection
#      rules (required reviewers and/or a tag deployment-branch filter) if you
#      want a human gate before publish — a bare environment enforces nothing
#      on its own; it only binds this job to the rubygems trusted-publisher.
#   3. Revoke any long-lived rubygems push key previously used by `rake release`.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC token for rubygems.org Trusted Publishing
      contents: write # let `rake release` push the v* tag if it isn't already present
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake test
      # Guard against a tag/version mismatch publishing the wrong gem: the
      # pushed tag (vX.Y.Z) must equal Rack::Proxy::VERSION.
      - name: Verify tag matches gem version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -Ilib -e 'require "rack/proxy/version"; print Rack::Proxy::VERSION')"
          if [ "$tag" != "$gem_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gem version $gem_version" >&2
            exit 1
          fi
      - uses: rubygems/release-gem@v1
        with:
          # The action's bundled await polls rubygems' full index, which can
          # lag far past the poller's ~5-minute timeout and fail the run after
          # a successful publish (v1.0.0 and v1.0.1 both hit this). We verify
          # against the fast versions API in the next step instead.
          await-release: "false"
      - name: Verify the release is live on rubygems.org
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            if curl -sf "https://rubygems.org/api/v1/versions/rack-proxy.json" |
                jq -e --arg v "$version" 'any(.[]; .number == $v)' > /dev/null; then
              echo "rack-proxy $version is live on rubygems.org"
              exit 0
            fi
            sleep 10
          done
          echo "rack-proxy $version not visible on rubygems.org after 5 minutes" >&2
          exit 1
