name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: "test (ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
        gemfile:
          - gemfiles/rack_3.gemfile
          - gemfiles/rack_2.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  # Non-blocking early-warning signal against the next Ruby.
  test-head:
    name: "test (ruby head, allowed to fail)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake test

  # Style + dependency audit + coverage floor (uses the default Gemfile, the
  # only one that carries the dev tooling).
  lint:
    name: lint, audit & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec standardrb
      - run: bundle exec bundler-audit check --update
      - run: bundle exec rake test
        env:
          COVERAGE: "1"

  # Verify the gem packages and installs with the files the gemspec declares.
  build:
    name: gem build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: gem build rack-proxy.gemspec
      - run: gem install ./rack-proxy-*.gem
